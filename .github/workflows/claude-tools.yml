# Временная проверка Claude: импорт workflow в настоящий n8n. Результаты — в tmp/claude-out.
name: claude-tools
on:
  push:
    branches: [tmp/claude-tools]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n8n: ["1", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.n8n == '1' && 22 || 24 }}
      - name: n8n
        run: |
          set +e
          mkdir -p out; export N8N_USER_FOLDER=$PWD/.n8nhome N8N_ENCRYPTION_KEY=test-only-key-123456 N8N_DIAGNOSTICS_ENABLED=false
          npm i -g n8n@${{ matrix.n8n }} > out/install.log 2>&1; n8n --version > out/version.txt 2>&1
          { n8n import:workflow --input=n8n/full.json; echo "rc=$?"; } > out/import-full.log 2>&1
          { n8n import:workflow --input=n8n/monitor-test.json; echo "rc=$?"; } > out/import-mon.log 2>&1
          n8n export:workflow --all --output=out/exported.json > out/export.log 2>&1
          { timeout 300 n8n execute --id=montest0000000001 --rawOutput; echo "rc=$?"; } > out/exec1.log 2>&1
          { timeout 300 n8n execute --id=montest0000000001 --rawOutput; echo "rc=$?"; } > out/exec2.log 2>&1
          { timeout 300 n8n execute --id=demomedmap0000001 --rawOutput; echo "rc=$?"; } > out/exec-map.log 2>&1
      - name: publish
        if: always()
        run: |
          rm -rf .n8nhome
          git config user.name claude-tools; git config user.email claude-tools@users.noreply.github.com
          git checkout -q --orphan o && git rm -rqf . >/dev/null 2>&1; git clean -fdq -e out
          git add out && git commit -qm "n8n ${{ matrix.n8n }}" && git push -qf origin HEAD:tmp/claude-out-n8n-${{ matrix.n8n }}
